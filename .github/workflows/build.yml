# Build Muzify for macOS (.zip) and iPhone/iPad (.ipa, unsigned).
# Every push builds and uploads artifacts; pushing a tag "v*" also publishes a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Translations
        run: python3 Scripts/l10n.py check

      - name: macOS app
        run: ./build.sh

      - name: iOS app
        run: Scripts/build_ios.sh

      - name: Simulator smoke test (iPhone + iPad screenshots)
        run: |
          Scripts/build_ios.sh --sim
          mkdir -p build/screenshots
          for kind in "iPhone 16 Pro" "iPad Pro 13-inch (M4)"; do
            UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; k=sys.argv[1]; print(next(d['udid'] for r,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in ds if d['name']==k))" "$kind")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" build/Muzify-sim.app
            xcrun simctl launch "$UDID" com.products.muzify.ios
            sleep 30
            xcrun simctl io "$UDID" screenshot "build/screenshots/${kind// /-}.png"
            xcrun simctl spawn "$UDID" launchctl list | grep -q muzify && echo "✓ $kind: app is running" || { echo "✗ $kind: app is not running"; exit 1; }
            xcrun simctl shutdown "$UDID"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: Muzify
          path: |
            build/Muzify.zip
            build/Muzify.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Muzify.zip
            build/Muzify.ipa
          generate_release_notes: true
